services:
  frontend:
    image: ${IMAGE_TAG}
    container_name: afrodita-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_APP_NAME=${VITE_APP_NAME:-CRM}
      - VITE_APP_ENV=${VITE_APP_ENV:-production}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - crm

networks:
  crm:
    name: crm-${DEPLOY_ENV:-production}
    external: true
